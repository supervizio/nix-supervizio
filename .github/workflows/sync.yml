name: Mirror supervizio's release

# supervizio's release pipeline serves, at https://supervizio.github.io/agent/channels/,
# the flake of the newest release its end-to-end validation installed through
# it. This keeps main equal to it: hourly, or by hand. .github/sync.sh says how.
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mirror the published flake
        run: bash .github/sync.sh nix --tag

  keepalive:
    # GitHub disables a public repository's scheduled workflows after 60 days
    # without activity, and releases can be further apart than that. Enabling
    # the workflow through the API, weekly, keeps the hourly mirror running.
    if: github.event.schedule == '41 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/sync.yml/enable"
